<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pendaftaran Diterima — InDeo Institute</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500,600;1,400&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-382CYXS7M1"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-382CYXS7M1');
</script>
<style>
  :root{
    --navy:#0B1F3A; --gold:#C9A84C; --cream:#FAF8F3; --ink-soft:#5b6472;
    --serif:'Cormorant Garamond', serif; --sans:'DM Sans', sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:var(--sans); background:var(--navy); color:#FAF8F3;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    text-align:center; padding:2rem;
  }
  .box{ max-width:520px; }
  .icon{
    width:56px;height:56px; border:1px solid var(--gold); border-radius:50%;
    display:flex;align-items:center;justify-content:center; margin:0 auto 24px;
    font-size:24px; color:var(--gold);
  }
  h1{ font-family:var(--serif); font-size:2rem; font-weight:600; margin-bottom:14px; }
  p{ color:rgba(250,248,243,.75); line-height:1.7; margin-bottom:16px; }
  .next-steps{ color:rgba(250,248,243,.6); font-size:.88rem; margin-bottom:28px; }
  a.btn{
    display:inline-block; background:var(--gold); color:var(--navy); font-weight:700;
    padding:13px 28px; text-decoration:none; border-radius:2px; font-size:.92rem;
  }
</style>
</head>
<body>
  <div class="box">
    <div class="icon">✓</div>
    <h1>Pendaftaran Diterima</h1>
    <p id="confirm-text">Pendaftaran Anda sudah kami terima.</p>
    <p class="next-steps">Tim kami akan menghubungi Anda via WhatsApp/email dalam 1×24 jam untuk konfirmasi & instruksi pembayaran.</p>
    <a class="btn" href="/bpr-bprs">Lihat Program Lain</a>
  </div>

  <script>
    (function(){
      try {
        var raw = sessionStorage.getItem('indeo-daftar-batch-confirm');
        if (raw) {
          var data = JSON.parse(raw);
          document.getElementById('confirm-text').innerHTML =
            'Pendaftaran Anda untuk <strong>' + data.programTitle + ' — batch ' + data.dateRange + '</strong> sudah kami terima.';
          sessionStorage.removeItem('indeo-daftar-batch-confirm');
        }
      } catch (e) { /* fallback ke teks generik di atas */ }
    })();
  </script>
</body>
</html>

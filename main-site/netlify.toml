[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Routing /api/* ditangani langsung oleh tiap Function lewat `export const config = { path: ... }`
# (Netlify Functions v2 declarative path) — tidak perlu redirect manual.

# publish = "." berarti SELURUH isi folder ini ikut ter-deploy sebagai static asset, termasuk
# folder tooling internal. Netlify tidak punya mekanisme "exclude dari publish dir" berbasis
# glob/.netlifyignore (per pengecekan Agustus 2026) — jadi /scripts/ (dev server lokal, bukan
# untuk publik) diblokir lewat redirect force di bawah, bukan lewat exclude di build config.
[[redirects]]
  from = "/scripts/*"
  to = "/"
  status = 404
  force = true

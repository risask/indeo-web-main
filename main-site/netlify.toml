[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Routing /api/* ditangani langsung oleh tiap Function lewat `export const config = { path: ... }`
# (Netlify Functions v2 declarative path) — tidak perlu redirect manual.

# netlify/functions/ dan scripts/ TIDAK berada di dalam publish dir ("public") — jadi keduanya
# structurally tidak mungkin ter-deploy sebagai static asset (allowlist by folder structure).
# Sebelumnya (saat publish = ".") ini dijamin lewat redirect blocklist manual /scripts/* → 404;
# sudah tidak perlu lagi sejak restrukturisasi ke public/ dan sudah diverifikasi lewat regression
# test (lihat riwayat commit "Restructure: move publish dir to public/...").
